<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="blogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="blogShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#blogBg)"/>

  <!-- Centered Decorative Card -->
  <g filter="url(#blogShadow)">
    <rect x="140" y="45" width="320" height="235" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Center Book / Research Icon -->
  <g transform="translate(300, 130)">
    <circle cx="0" cy="0" r="48" fill="#ECFDF5"/>
    <circle cx="0" cy="0" r="38" fill="url(#bookGrad)"/>

    <!-- Open Book Symbol -->
    <path d="M-18 -10C-10 -14 -2 -12 0 -8C2 -12 10 -14 18 -10V14C10 10 2 12 0 16C-2 12 -10 10 -18 14V-10Z" fill="#FFFFFF"/>
    <line x1="0" y1="-8" x2="0" y2="16" stroke="#059669" stroke-width="2"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(300, 235)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">CONSUMER RESEARCH</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">Unbiased Consumer Guides</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">GroupBuying.store • Verified Technical Specs &amp; Pricing</text>
</svg>
