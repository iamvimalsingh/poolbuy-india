<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="waterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="vesselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="brineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="waterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#waterBg)"/>

  <!-- Centered Card -->
  <g filter="url(#waterShadow)">
    <rect x="140" y="45" width="320" height="235" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Water Softener Vessel & Brine Tank Assembly -->
  <g transform="translate(205, 70)">
    <!-- FRP Resin Mineral Vessel -->
    <rect x="35" y="40" width="55" height="120" rx="14" fill="url(#vesselGrad)" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Automatic Multi-Port Valve Head -->
    <rect x="38" y="16" width="49" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Digital LCD on valve -->
    <rect x="48" y="22" width="29" height="13" rx="2" fill="#0EA5E9"/>
    <!-- Top Pipe Connections -->
    <line x1="25" y1="26" x2="38" y2="26" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
    <line x1="87" y1="26" x2="100" y2="26" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>

    <!-- Brine Tank (Salt Storage) -->
    <rect x="105" y="70" width="55" height="90" rx="8" fill="url(#brineGrad)" stroke="#64748B" stroke-width="1.5"/>
    <rect x="100" y="65" width="65" height="8" rx="3" fill="#475569"/>
    <!-- Brine tubing connecting valve to tank -->
    <path d="M78 35 V55 H132 V70" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Pre-filter Housing (20" Jumbo) -->
    <rect x="5" y="75" width="22" height="65" rx="4" fill="#0369A1" stroke="#0284C7" stroke-width="1"/>
    <rect x="3" y="68" width="26" height="8" rx="2" fill="#1E293B"/>

    <!-- Water Drop Emblem Floating -->
    <g transform="translate(160, 25)">
      <path d="M15 0 C15 0 30 18 30 28 C30 36.3 23.3 43 15 43 C6.7 43 0 36.3 0 28 C0 18 15 0 15 0 Z" fill="url(#dropGrad)"/>
      <!-- Softener sparkle / shine -->
      <circle cx="21" cy="24" r="3" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(300, 248)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle" letter-spacing="0.5">28L FOOD-GRADE RESIN • AUTO</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">Whole-House Water Softener</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Automatic Regeneration • Scale Protection • Zero Pressure Drop</text>
</svg>
