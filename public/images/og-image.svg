<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="1050" cy="120" r="320" fill="#10B981" opacity="0.18"/>
  <circle cx="150" cy="550" r="280" fill="#34D399" opacity="0.12"/>

  <!-- Central Structured Card -->
  <g filter="url(#shadow)">
    <rect x="100" y="75" width="1000" height="480" rx="28" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="2"/>
  </g>

  <!-- Top Badges / Brand Pill -->
  <g transform="translate(160, 135)">
    <rect x="0" y="0" width="195" height="36" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="97" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="1">GROUPBUYING.STORE</text>

    <rect x="210" y="0" width="135" height="36" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="277" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">PoolBuy India</text>
  </g>

  <!-- Main Headline -->
  <text x="160" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-1">
    Community-Led Group Buying Across India
  </text>

  <!-- Subtitle / Value Proposition -->
  <text x="160" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">
    Team up with local buyers in your city to aggregate volume demand.
  </text>
  <text x="160" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#475569">
    Unlock institutional bulk pricing directly from authorized suppliers.
  </text>

  <!-- Key Pillars / Feature Pills -->
  <g transform="translate(160, 385)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="245" height="52" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="24" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065F46">✓ 100% Free Interest</text>

    <!-- Pillar 2 -->
    <rect x="260" y="0" width="255" height="52" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="284" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065F46">✓ Zero Advance Payment</text>

    <!-- Pillar 3 -->
    <rect x="530" y="0" width="280" height="52" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <text x="554" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#065F46">✓ Verified Local Dealers</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(160, 485)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B">
      Categories: Solar • Power Backup • Water Softeners • Electric Scooters • Consumer Electronics
    </text>
    <text x="880" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="end">
      https://groupbuying.store
    </text>
  </g>
</svg>
