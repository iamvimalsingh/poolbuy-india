<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="batteryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="inverterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="backupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#batteryBg)"/>

  <!-- Centered Card -->
  <g filter="url(#backupShadow)">
    <rect x="140" y="45" width="320" height="235" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Inverter & Battery Artwork -->
  <g transform="translate(190, 75)">
    <!-- Top Inverter Unit -->
    <rect x="25" y="10" width="170" height="48" rx="8" fill="url(#inverterGrad)" stroke="#334155" stroke-width="1.5"/>
    <!-- Inverter Display Screen -->
    <rect x="40" y="20" width="55" height="26" rx="4" fill="#0284C7"/>
    <!-- Digital wave / sine wave inside display -->
    <path d="M44 33 Q48 24 53 33 T62 33 T71 33 T80 33 T89 33" stroke="#BAE6FD" stroke-width="1.5" fill="none"/>
    <!-- Status LED dots -->
    <circle cx="115" cy="28" r="3" fill="#10B981"/>
    <circle cx="130" cy="28" r="3" fill="#F59E0B"/>
    <circle cx="145" cy="28" r="3" fill="#38BDF8"/>
    <!-- Power Button -->
    <circle cx="172" cy="34" r="7" fill="#334155" stroke="#64748B" stroke-width="1"/>
    <path d="M172 30V34" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bottom 200Ah Tall Tubular Battery -->
    <rect x="15" y="70" width="190" height="85" rx="8" fill="url(#batteryGrad)" stroke="#1E40AF" stroke-width="1.5"/>
    <!-- Battery Vent Plugs (6 plugs for 12V tubular) -->
    <circle cx="40" cy="65" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="68" cy="65" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="96" cy="65" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="124" cy="65" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="152" cy="65" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="180" cy="65" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <!-- Battery Terminal Posts -->
    <rect x="25" y="60" width="8" height="10" rx="2" fill="#DC2626"/>
    <rect x="187" y="60" width="8" height="10" rx="2" fill="#1E293B"/>

    <!-- Battery Capacity Badge text inside -->
    <rect x="35" y="90" width="150" height="42" rx="6" fill="#1E3A8A" fill-opacity="0.6"/>
    <text x="110" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">200 Ah C20</text>
    <text x="110" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#93C5FD" text-anchor="middle" letter-spacing="0.5">HEAVY-DUTY TALL TUBULAR</text>

    <!-- Trolley Wheels at base -->
    <rect x="5" y="156" width="210" height="6" rx="3" fill="#64748B"/>
    <circle cx="25" cy="166" r="6" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="195" cy="166" r="6" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <!-- Package Pill -->
  <g transform="translate(300, 248)">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.5">INVERTER + BATTERY + TROLLEY</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">Home Power Backup Combo</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Pure Sine Wave Inverter • 200 Ah Tall Tubular • Full Installation</text>
</svg>
