<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <!-- Centered Decorative Card -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="45" width="300" height="230" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Center Shield Icon -->
  <g transform="translate(300, 130)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="48" fill="#ECFDF5"/>
    <circle cx="0" cy="0" r="38" fill="url(#shieldGrad)"/>

    <!-- Users / Community Group Motif -->
    <!-- Center User -->
    <circle cx="0" cy="-10" r="9" fill="#FFFFFF"/>
    <path d="M-15 14C-15 7.5 -7 4 0 4C7 4 15 7.5 15 14" fill="#FFFFFF"/>
    <!-- Left User Silhouette -->
    <circle cx="-16" cy="-6" r="6" fill="#D1FAE5"/>
    <path d="M-27 14C-27 9.5 -21 7 -16 7C-13.5 7 -11 7.8 -9 9.2" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Right User Silhouette -->
    <circle cx="16" cy="-6" r="6" fill="#D1FAE5"/>
    <path d="M27 14C27 9.5 21 7 16 7C13.5 7 11 7.8 9 9.2" stroke="#D1FAE5" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Checkmark Badge -->
    <circle cx="18" cy="18" r="9" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M14 18L17 21L22 15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title Pill -->
  <g transform="translate(300, 235)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">VERIFIED GROUP BUY</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">PoolBuy India Collective Deal</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Aggregating Local Demand • Zero Advance Payment</text>
</svg>
