<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="carsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#carsBg)"/>

  <g filter="url(#carShadow)">
    <rect x="140" y="45" width="320" height="235" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Car Silhouette Artwork -->
  <g transform="translate(185, 90)">
    <!-- Wheels -->
    <circle cx="50" cy="95" r="22" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
    <circle cx="50" cy="95" r="12" fill="#E2E8F0"/>
    <circle cx="180" cy="95" r="22" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
    <circle cx="180" cy="95" r="12" fill="#E2E8F0"/>

    <!-- Car Body -->
    <path d="M15 85 C15 75 25 72 40 72 L65 72 L95 42 L160 42 L190 70 L215 72 C225 72 230 78 230 85 L230 92 L200 92 C198 82 190 75 180 75 C170 75 162 82 160 92 L70 92 C68 82 60 75 50 75 C40 75 32 82 30 92 L15 92 Z" fill="url(#carBody)"/>

    <!-- Windows -->
    <path d="M72 70 L98 48 L130 48 L130 70 Z" fill="#93C5FD"/>
    <path d="M136 70 L136 48 L156 48 L180 70 Z" fill="#93C5FD"/>

    <!-- Headlight & Taillight -->
    <path d="M222 76 L230 78 L230 84 L220 84 Z" fill="#FEF08A"/>
    <path d="M15 78 L22 78 L20 84 L15 84 Z" fill="#EF4444"/>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(300, 248)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.5">CITY BULK QUOTATION</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">Cars &amp; Compact SUVs</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Authorized Dealership Group Invoicing • Zero Brokerage</text>
</svg>
