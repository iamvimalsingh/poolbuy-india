<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="solarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#solarBg)"/>

  <!-- Centered Card -->
  <g filter="url(#solarShadow)">
    <rect x="140" y="45" width="320" height="235" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Sun Graphic -->
  <g transform="translate(370, 95)">
    <circle cx="0" cy="0" r="24" fill="url(#sunGrad)"/>
    <!-- Rays -->
    <path d="M0 -34V-28M0 28V34M-34 0H-28M28 0H34M-24 -24L-20 -20M20 20L24 24M-24 24L-20 20M20 -20L24 -24" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Solar Photovoltaic Panel Array in Perspective -->
  <g transform="translate(195, 125)">
    <!-- Base frame -->
    <polygon points="30,85 180,85 205,30 55,30" fill="url(#panelGrad)" stroke="#38BDF8" stroke-width="2"/>
    <!-- Panel Grid Lines - vertical -->
    <line x1="80" y1="30" x2="68" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="105" y1="30" x2="105" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="130" y1="30" x2="142" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="155" y1="30" x2="180" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Panel Grid Lines - horizontal -->
    <line x1="47" y1="48" x2="192" y2="48" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="38" y1="67" x2="186" y2="67" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Mounting Legs -->
    <line x1="55" y1="85" x2="55" y2="102" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="85" x2="180" y2="102" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="85" x2="30" y2="95" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="205" y1="30" x2="205" y2="60" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Clean Energy Pill -->
  <g transform="translate(300, 248)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0.5">PM SURYA GHAR COMPLIANT</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">Residential Rooftop Solar System</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Complete Turnkey Package • Net-Metering • Subsidy Guidance</text>
</svg>
