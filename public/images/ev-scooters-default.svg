<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="evGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="evShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#evBg)"/>

  <!-- Centered Card -->
  <g filter="url(#evShadow)">
    <rect x="140" y="45" width="320" height="235" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Electric Scooter Silhouette Artwork -->
  <g transform="translate(195, 75)">
    <!-- Wheels -->
    <circle cx="45" cy="120" r="24" fill="#334155" stroke="#0F172A" stroke-width="3"/>
    <circle cx="45" cy="120" r="14" fill="#E2E8F0"/>
    <circle cx="165" cy="120" r="24" fill="#334155" stroke="#0F172A" stroke-width="3"/>
    <circle cx="165" cy="120" r="14" fill="#E2E8F0"/>

    <!-- Chassis Body -->
    <path d="M45 110 H115 L145 55 L135 30 H160" stroke="url(#evGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M75 110 L105 75 H138" stroke="url(#evGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Seat / Saddle -->
    <path d="M60 75 H105" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>

    <!-- Headlight / Handlebar -->
    <line x1="130" y1="30" x2="165" y2="30" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="162" cy="42" r="5" fill="#38BDF8"/>

    <!-- Electric Lightning Spark Bolt -->
    <path d="M102 95 L95 106 H103 L98 118 L112 104 H104 L108 95 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(300, 248)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">HIGH-SPEED 2W EV</text>
  </g>

  <!-- Captions -->
  <text x="300" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.3">Electric Scooters &amp; Commuters</text>
  <text x="300" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">Authorized Dealership Delivery • Subsidy &amp; On-Road Guidance</text>
</svg>
